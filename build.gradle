
plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
    id "dev.ithundxr.silk" version "0.11.15"
    id "net.kyori.blossom" version "2.1.0"
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

String gitHash = getGitHash();
String getGitHash() {
    try { 
        ExecOutput output = providers.exec commandLine("git", "rev-parse", "HEAD")
        return output.standardOutput.asText.get().trim()
    } catch (Throwable e) { return "(n/a)" }
}

base {
    archivesName = "$mod_id-$minecraft_version"
    group = mod_group_id
    version = mod_version
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {

    version = project.neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')
    validateAccessTransformers = true

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())        
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'DEBUG'
            jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]
            // systemProperty 'mixin.debug.verbose', 'true'
            // systemProperty 'mixin.debug.export', 'true'
            systemProperty 'terminal.ansi', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

sourceSets.main{
    resources {
        srcDir 'src/generated/resources'
        exclude '.cache/'
    }

    blossom.javaSources {
        property("version", mod_version)
        property("hash", gitHash)
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    maven { url = "https://maven.createmod.net/" } // create
    maven { url = "https://mvn.devos.one/snapshots" } // registrate
    maven { url = "https://maven.blamejared.com/" } // jei & vazkii's
    maven { url = "https://maven.theillusivec4.top/" } // curios
    maven { url = "https://repo.lucko.me/" } // spark
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}") { transitive = false }
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("me.lucko:spark-common:${spark_version}")

    def ejmlModules = [ "core", "ddense", "dsparse" ]
    ejmlModules.each {
        implementation("org.ejml:ejml-${it}:${ejml_version}")
        additionalRuntimeClasspath("org.ejml:ejml-${it}:${ejml_version}")
        jarJar("org.ejml:ejml-${it}:${ejml_version}")
    }

    implementation("org.openjdk.jol:jol-core:${jol_version}")
    additionalRuntimeClasspath("org.openjdk.jol:jol-core:${jol_version}")
    jarJar("org.openjdk.jol:jol-core:${jol_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

processResources {
    def buildProps = project.properties.clone()
    buildProps.put('file', [jarVersion: project.version])
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand buildProps
    }
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}