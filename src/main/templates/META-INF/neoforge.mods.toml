
modLoader="javafml"
loaderVersion="${loader_version_range}"
issueTrackerURL="https://github.com/quattage/mechano/issues"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

displayURL="https://github.com/quattage/mechano"
logoFile="logo.png"
credits=""
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
    config="${mod_id}.mixins.json"




# base dependencies
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.4,6.1.0)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]] 
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"